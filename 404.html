<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Page Not Found (404) – Monkey APP</title>
  <meta name="description" content="The page you're looking for could not be found. Explore Monkey APP's useful mobile apps.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/site-v4.css">
  <style>
    .not-found {min-height: min(72vh, 700px); display:flex; align-items:center; padding:72px 0 96px;}
    .not-found-inner {max-width:760px; margin:auto; text-align:center;}
    .error-code {font-size:clamp(92px,17vw,180px); font-weight:850; line-height:1; letter-spacing:-.075em; margin:0 0 20px; color:#6655d9;}
    .not-found h1 {font-size:clamp(30px,5vw,48px); margin:0 0 18px; letter-spacing:-.035em;}
    .not-found p {font-size:18px; line-height:1.7; color:#64748b; max-width:530px; margin:0 auto 30px;}
    .not-found .actions {display:flex; justify-content:center; gap:12px; flex-wrap:wrap;}
    .not-found .eyebrow {margin-bottom:18px;}
    @media(max-width:600px){.not-found{padding:60px 0 80px;min-height:60vh}.not-found p{font-size:16px}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/"><img alt="Monkey APP logo" src="/assets/monkey-app-logo.svg" width="44" height="44"><span>Monkey APP</span></a>
      <nav class="navlinks" aria-label="Main navigation">
        <a href="/">Home</a><a href="/apps/">Apps</a><a href="/privacy-policy.html">Privacy</a><a href="/terms-of-service.html">Terms</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="not-found">
      <div class="container">
        <div class="not-found-inner">
          <div class="eyebrow">Oops! This page is missing</div>
          <div class="error-code" aria-hidden="true">404</div>
          <h1>Page not found</h1>
          <p>The page you’re looking for may have moved or no longer exists. Let’s get you back to something useful.</p>
          <div class="actions">
            <a class="btn primary" href="/">Back to home →</a>
            <a class="btn" href="/apps/en/">Explore our apps</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container footer-row"><div><div class="footer-brand"><img alt="" src="/assets/monkey-app-logo.svg" width="34" height="34">Monkey APP</div><div>© 2026 Monkey APP. All rights reserved.</div></div><div class="tools"><a href="/privacy-policy.html">Privacy Policy</a><a href="/terms-of-service.html">Terms of Service</a></div></div></footer>
</body>
</html>
